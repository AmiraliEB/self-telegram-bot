[project]
name = "self"
version = "0.1.0"
description = "a self-bot for telegram"
readme = "README.md"

requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.14.3",
    "aiosqlite>=0.22.1",
    "cryptg>=0.6.0",
    "environs>=15.2.0",
    "telethon>=1.45.0",
]

[project.scripts]
self = "self.main:main"

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"
